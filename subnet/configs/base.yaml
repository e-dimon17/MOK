# Canonical Stage-2 run configuration (MoK-54B). This file + an overlay fully
# determine a run; the canonical hash of the merged RunConfig goes on-chain.
# Values follow /workspace/stage2-training-playbook.md and the master roadmap.

model:
  num_layers: 32
  hidden_size: 4096
  num_q_heads: 32
  num_kv_heads: 8
  head_dim: 128
  vocab_size: 65536
  seq_len: 4096
  rope_theta: 10000.0
  num_experts: 128
  top_k: 8
  intermediate_size: 1024
  num_dense_layers: 3               # DeepSeek-V3-style dense SwiGLU first layers
  dense_intermediate_size: 9216     # 9 x 1024 — matches activated MoE width
  ep_size: 8
  aux_loss_coef: 1.0e-4
  router_z_coef: 1.0e-3
  output_z_coef: 1.0e-4
  bias_update_rate: 1.0e-3
  routed_precision: mxfp8

mok:
  # MXFP8 defaults from bench_mok.py; fleet calibration overwrites via mok_tuned.yaml
  fwd_num_comm_sms: 36
  bwd_num_comm_sms: 36
  minibatch_size: 4096
  macrobatch_size: 131072
  schedule_capacity_multiplier: 1.05    # warmup: ceil(8*1.05)=9 => capacity 589,824 rows
                                      # >= absolute worst case 528,368 (total collapse
                                      # + 16*255 padding) => trap mathematically
                                      # unreachable. Annealed to 0.5 by manifest
                                      # amendment once balance converges.
  capacity_anneal_to: 0.5
  capacity_anneal_util_threshold: 0.4

window:
  inner_steps: 500
  blocks_per_window: 225                # ~45 min at 12 s/block
  upload_grace_s: 90
  tokens_per_rank_microbatch: 8192
  grad_accum: 8
  accum_ramp_tokens: 50000000000
  accum_ramp_start: 2
  gather_peer_count: 20
  reserve_peer_count: 10
  checkpoint_every_windows: 10
  warmup_null_windows: 2

compression:
  target_chunk: 64
  topk: 64
  quant_bins: 4
  quant_range_sigmas: 6.0
  ef_beta: 0.95
  use_dct: false

outer:
  kind: nesterov                        # calibration may pin "sgd" (EF replaces momentum)
  lr: 0.7
  momentum: 0.9
  clip: median_norm

inner:
  lr:
    kind: wsd_flat
    peak_lr: 3.0e-4
    warmup_steps: 2000
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  grad_clip: 1.0
  adam_reset_every_windows: 1

scoring:
  eval_sequences: 8
  eval_lr_factor: 0.2
  binary_ema_alpha: 0.05
  binary_ema_threshold: 0.10
  binary_warmup_windows: 10
  openskill_beta: 7.0
  openskill_tau: 0.1
  sync_max_steps_behind: 2.0
  windows_per_weights: 3
  gather_share: 0.75
  reserve_share: 0.25
  top_ratio: 2.0
  reserve_decay: 0.5
  overlap_threshold: 0.4

audit:
  probability: 0.075
  quorum: 2
  auditors: 3
  naughty_windows: 20
  report_deadline_windows: 2

rollback:
  spike_threshold_nats: 0.15
  spike_baseline_windows: 5
  vote_supermajority: 0.6667
  vote_window_span: 2
  activation_delay_windows: 1

chain:
  network: ${BT_NETWORK:test}
  netuid: ${BT_NETUID:0}
  wallet_name: ${BT_WALLET_NAME:default}
  wallet_hotkey: ${BT_WALLET_HOTKEY:default}

storage: {}
data: {}

telemetry:
  wandb_project: mok-subnet-stage2

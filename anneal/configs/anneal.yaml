# Quality anneal: SAME engine, SAME protocol; only the data tree and
# the LR segment change. Applied on-chain as a manifest phase
# amendment; this overlay is for local tools and calibration rehearsal.
inner:
  lr:
    kind: wsd_linear_decay
    peak_lr: 3.0e-4
    warmup_steps: 2000
    decay_total_tokens: 400000000000     # 400B tokens, peak -> 0
data:
  dataset_manifest_path: manifests/anneal.json

# Context extension to 16k: new workspace shape (num_local_tokens
# 16384 => one 16,384-token sequence per GPU per microbatch), RoPE theta 5e5,
# low constant LR. requires_restart is set in the manifest phase entry: the
# engine exits cleanly at the boundary and the supervisor relaunches.
model:
  seq_len: 16384
  rope_theta: 500000.0
window:
  tokens_per_rank_microbatch: 16384
  grad_accum: 4                          # keeps 524,288 tokens/node/inner-step
inner:
  lr:
    kind: const
    peak_lr: 3.0e-4
    warmup_steps: 0
    const_lr: 1.0e-5
data:
  dataset_manifest_path: manifests/longdoc.json
